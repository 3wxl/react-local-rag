[project]
name = "api"
version = "0.1.0"
description = "RAG 平台后端：FastAPI + LangGraph + pgvector"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "pydantic-settings>=2.4",
    "pgvector>=0.3",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
