# 生产形态：api + postgres(pgvector) 两个容器，单机可交付（路线图：不引 MinIO/Redis）。
#
#   1) 准备模型权重到 apps/web/public/models/（见根 README，容器里以只读卷挂载）
#   2) docker compose up -d
#   3) 灌语料： docker compose exec api uv run python scripts/ingest_corpus.py /corpus
#
# 注意：默认用 SQLite 也能跑（零依赖）。这里给的是"单库起步"的正式部署形态 ——
# 元数据与向量同库，事务一致、少一个运维对象。

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # 仅本机暴露：私有化部署时不要直接对外
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      DATA_DIR: /data
      MODELS_DIR: /models
      EVAL_DIR: /eval
      LLM_PROVIDER: onnx
      # M3：成本预算（超限拒绝并说明原因）；本地通道价目为 0，接云端通道时配 COST_PER_1K_*
      REQUEST_TOKEN_BUDGET: "4096"
      REQUEST_COST_LIMIT_USD: "0.5"
      GRAPH_MAX_STEPS: "12"
      # 检查点：SQLite 文件落在 /data 卷上（单副本部署；多副本时换 Postgres saver）
      CHECKPOINT_BACKEND: sqlite
      # MCP 工具（可选，默认关闭）：挂仓库自带 TS server 时取消注释
      # MCP_SERVER_COMMAND: "node --import tsx /web/scripts/mcp/server.ts --backup /data/backup.json"
      # MCP_ALLOWLIST: "search_docs,doc_outline,read_chunks"
    volumes:
      # 模型权重与评测资产都以只读挂载，镜像里不打包上百 MB 的权重
      - ../../apps/web/public/models:/models:ro
      - ../../packages/eval:/eval:ro
      - apidata:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # 单进程：任务运行器与 BM25 缓存在进程内（M1 明确不做多进程编排）
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

volumes:
  pgdata:
  apidata:
