name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # monorepo：前端在 apps/web，所有 npm 命令都在这层目录执行
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # package-lock.json 现在在子目录，缓存路径必须显式指定，否则缓存永远 miss
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # 检索评测基线（读固化向量/精排分，确定性、无模型依赖），防止回归
      - name: Retrieval eval baseline
        run: npm run eval

      # 幻觉校验组件的 P/R（读固化打分，无模型依赖）
      - name: Verify component P/R
        run: npm run eval:verify -- --check
